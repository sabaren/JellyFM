<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JellyFM</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: #2e2e3e;
    --accent: #7c6af7;
    --accent2: #a78bfa;
    --text: #e2e2f0;
    --muted: #7070a0;
    --danger: #f87171;
    --success: #4ade80;
    --radius: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent2); }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); margin-left: auto;
    transition: background 0.3s;
  }
  .status-dot.ok  { background: var(--success); }
  .status-dot.err { background: var(--danger); }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 16px;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 20px;
  }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .panel-header {
    padding: 12px 16px;
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .panel-body { padding: 16px; }

  label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 8px 10px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 0.875rem;
    outline: none; transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .field { margin-bottom: 12px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px 14px; border-radius: 6px; font-size: 0.875rem; font-weight: 500;
    cursor: pointer; border: none; transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent2); }
  .btn-ghost {
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent2); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover:not(:disabled) { background: var(--danger); color: #fff; }

  .station-item {
    display: flex; flex-direction: column; gap: 6px;
    padding: 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; transition: all 0.15s;
    margin-bottom: 8px;
  }
  .station-item:hover { background: var(--surface2); border-color: var(--border); }
  .station-item.active { background: var(--surface2); border-color: var(--accent); }
  .station-name { font-weight: 600; }
  .station-meta { font-size: 0.78rem; color: var(--muted); }

  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 99px;
    font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .badge-live { background: #1a3a2a; color: var(--success); }
  .badge-idle { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

  /* Now playing */
  .now-playing-card {
    background: var(--surface2); border-radius: 8px; padding: 20px;
    border: 1px solid var(--border); margin-bottom: 16px;
    min-height: 100px; display: flex; flex-direction: column; justify-content: center;
  }
  .track-title  { font-size: 1.1rem; font-weight: 700; margin-bottom: 2px; }
  .track-artist { color: var(--muted); margin-bottom: 2px; }
  .track-album  { font-size: 0.78rem; color: var(--muted); }
  .track-next {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
    font-size: 0.8rem; color: var(--muted);
  }
  .track-next strong { color: var(--text); }

  /* Elapsed timer */
  .elapsed-row {
    margin-top: 10px;
    display: flex; align-items: center; gap: 10px;
    font-size: 0.78rem; color: var(--muted);
  }
  .elapsed-bar-wrap {
    flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .elapsed-bar {
    height: 100%; background: var(--accent); border-radius: 2px;
    transition: width 1s linear;
  }

  /* Volume */
  .volume-row {
    display: flex; align-items: center; gap: 10px; margin-top: 12px;
    font-size: 0.8rem; color: var(--muted);
  }
  input[type=range] {
    width: 100px; accent-color: var(--accent); cursor: pointer;
    padding: 0; background: none; border: none;
  }

  .transport { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }

  .live-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 9px; border-radius: 99px; font-size: 0.7rem; font-weight: 700;
    background: #1a3a2a; color: var(--success); text-transform: uppercase; letter-spacing: 0.08em;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--success);
    animation: pulse 1.5s ease-in-out infinite;
  }

  .empty { color: var(--muted); font-size: 0.875rem; }

  #toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px;
    font-size: 0.85rem; max-width: 320px;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; z-index: 9999;
  }
  #toast.show     { opacity: 1; transform: translateY(0); }
  #toast.err      { border-color: var(--danger); color: var(--danger); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
</style>
</head>
<body>

<header>
  <h1>Jelly<span>FM</span></h1>
  <div id="statusDot" class="status-dot" title="Server status"></div>
</header>

<!-- Hidden audio element — attaches to the live server broadcast -->
<audio id="player" preload="none"></audio>

<main>
  <!-- Left: create + list + voice picker -->
  <div>
    <div class="panel" style="margin-bottom:16px">
      <div class="panel-header">New Station</div>
      <div class="panel-body">
        <div class="field">
          <label>Station name</label>
          <input id="newName" placeholder="e.g. Late Night Jazz" />
        </div>
        <div class="field">
          <label>Genre</label>
          <select id="newGenre"><option value="">— loading —</option></select>
        </div>
        <div class="field" style="display:flex;align-items:center;gap:8px;margin-bottom:0">
          <input type="checkbox" id="newShuffle" checked style="width:auto">
          <label for="newShuffle" style="margin:0;cursor:pointer">Shuffle</label>
        </div>
        <div style="margin-top:14px">
          <button class="btn btn-primary" id="createBtn" onclick="createStation()">Create Station</button>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:16px">
      <div class="panel-header">Announcer Voice</div>
      <div class="panel-body">
        <div class="field" style="margin-bottom:8px">
          <label>Server voice</label>
          <select id="voiceSelect" onchange="setServerVoice()">
            <option value="">— loading —</option>
          </select>
        </div>
        <button class="btn btn-ghost" style="font-size:0.8rem;padding:5px 10px" onclick="previewVoice()">Preview voice</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">Stations</div>
      <div class="panel-body" id="stationList">
        <p class="empty">No stations yet.</p>
      </div>
    </div>
  </div>

  <!-- Right: now playing -->
  <div>
    <div class="panel">
      <div class="panel-header">Now Playing</div>
      <div class="panel-body" id="nowPlayingPanel">
        <p class="empty">Create a station and hit Play.</p>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
const API   = '';
const audio = document.getElementById('player');

let selectedId   = null;
let isPlaying    = false;
let pollInterval = null;
let lastTrackId  = null;   // detect track changes in poll

// ── Bootstrap ─────────────────────────────────────────────────────────────────
async function init() {
  await Promise.all([checkHealth(), loadGenres(), loadServerVoices()]);
  await loadStations();

  audio.addEventListener('error', (e) => {
    console.error('Stream error', e);
    toast('Stream error — reconnecting…', true);
    // Brief delay then re-attach to keep the stream alive
    setTimeout(() => {
      if (isPlaying && selectedId) {
        attachStream(selectedId);
      }
    }, 3000);
  });
}

async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    document.getElementById('statusDot').className = r.ok ? 'status-dot ok' : 'status-dot err';
  } catch {
    document.getElementById('statusDot').className = 'status-dot err';
  }
}

async function loadGenres() {
  try {
    const r = await fetch(`${API}/genres`);
    const genres = await r.json();
    const sel = document.getElementById('newGenre');
    sel.innerHTML = genres.length
      ? genres.map(g => `<option value="${esc(g.name)}">${esc(g.name)}${g.track_count ? ` (${g.track_count})` : ''}</option>`).join('')
      : '<option value="">No genres found</option>';
  } catch { toast('Could not reach server', true); }
}

// ── Stations ──────────────────────────────────────────────────────────────────
async function loadStations() {
  try {
    const r = await fetch(`${API}/stations`);
    const stations = await r.json();
    renderStationList(stations);
  } catch {}
}

function renderStationList(stations) {
  const el = document.getElementById('stationList');
  if (!stations.length) { el.innerHTML = '<p class="empty">No stations yet.</p>'; return; }
  el.innerHTML = stations.map(s => {
    const live = (s.id === selectedId && isPlaying);
    return `
      <div class="station-item ${s.id === selectedId ? 'active' : ''}" onclick="selectStation('${s.id}')">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="station-name">${esc(s.name)}</span>
          <span class="badge ${live ? 'badge-live' : 'badge-idle'}">${live ? '● LIVE' : 'idle'}</span>
        </div>
        <span class="station-meta">${esc(s.genre)} · ${s.queue.length} tracks</span>
      </div>`;
  }).join('');
}

async function createStation() {
  const name    = document.getElementById('newName').value.trim();
  const genre   = document.getElementById('newGenre').value;
  const shuffle = document.getElementById('newShuffle').checked;
  if (!name || !genre) { toast('Name and genre required', true); return; }
  const btn = document.getElementById('createBtn');
  btn.disabled = true;
  try {
    const r = await fetch(`${API}/stations`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, genre, shuffle }),
    });
    if (!r.ok) throw new Error((await r.json()).detail);
    const station = await r.json();
    document.getElementById('newName').value = '';
    toast(`Station "${station.name}" created`);
    await loadStations();
    selectStation(station.id);
  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; }
}

async function selectStation(id) {
  if (selectedId && selectedId !== id) stopStream();
  selectedId = id;
  await loadStations();
  await renderNowPlaying();
}

async function deleteStation(id) {
  if (!confirm('Delete this station?')) return;
  if (selectedId === id) {
    stopStream();
    selectedId = null;
    document.getElementById('nowPlayingPanel').innerHTML = '<p class="empty">Create a station and hit Play.</p>';
  }
  await fetch(`${API}/stations/${id}`, { method: 'DELETE' });
  await loadStations();
}

// ── Stream controls ───────────────────────────────────────────────────────────
function attachStream(id) {
  // Re-attach with a cache-buster so the browser doesn't serve a stale response
  audio.src = `${API}/stations/${id}/stream?t=${Date.now()}`;
  audio.load();
  audio.play().catch(() => toast('Tap screen first, then press Play', true));
}

async function play() {
  if (!selectedId) return;
  attachStream(selectedId);
  isPlaying = true;
  startPolling();
  await loadStations();
  await renderNowPlaying();
}

function stopStream() {
  audio.pause();
  audio.src = '';
  isPlaying = false;
  stopPolling();
  loadStations();
}

async function togglePlay() {
  if (isPlaying) {
    stopStream();
    renderNowPlaying();
  } else {
    await play();
  }
}

async function skip() {
  if (!selectedId) return;
  await fetch(`${API}/stations/${selectedId}/skip`, { method: 'POST' });
  toast('Skipping…');
}

async function refill() {
  if (!selectedId) return;
  await fetch(`${API}/stations/${selectedId}/refill`, { method: 'POST' });
  toast('Queue refilled');
}

// ── Now-playing poll ──────────────────────────────────────────────────────────
function startPolling() {
  stopPolling();
  pollInterval = setInterval(pollNowPlaying, 2500);
}

function stopPolling() {
  clearInterval(pollInterval);
  pollInterval = null;
}

async function pollNowPlaying() {
  if (!selectedId || !isPlaying) return;
  try {
    const r = await fetch(`${API}/stations/${selectedId}/now-playing`);
    const np = await r.json();

    // Update track info if changed
    const tid = np.current?.id ?? null;
    if (tid !== lastTrackId) {
      lastTrackId = tid;
      renderTrackInfo(np);
    }

    // Always update elapsed / live chip
    updateElapsed(np.elapsed_seconds, np.current?.duration_ticks);
  } catch {}
}

function renderTrackInfo(np) {
  const card = document.getElementById('trackCard');
  if (!card) return;

  const t = np.current;
  if (!t) { card.innerHTML = '<p class="empty">Waiting for broadcast…</p>'; return; }

  card.innerHTML = `
    <div class="track-title">${esc(t.name)}</div>
    <div class="track-artist">${esc(t.artist)}</div>
    ${t.album ? `<div class="track-album">${esc(t.album)}</div>` : ''}
    <div class="elapsed-row">
      <span id="elapsedTime">0:00</span>
      <div class="elapsed-bar-wrap"><div class="elapsed-bar" id="elapsedBar" style="width:0%"></div></div>
      <span id="durationTime">${t.duration_ticks ? fmt(t.duration_ticks / 10_000_000) : '--:--'}</span>
    </div>
    ${np.next ? `<div class="track-next">Up next: <strong>${esc(np.next.name)}</strong> by ${esc(np.next.artist)}</div>` : ''}
  `;
}

function updateElapsed(elapsedSec, durationTicks) {
  const el = document.getElementById('elapsedTime');
  const bar = document.getElementById('elapsedBar');
  if (!el || elapsedSec == null) return;
  el.textContent = fmt(elapsedSec);
  if (bar && durationTicks) {
    const pct = Math.min(100, (elapsedSec / (durationTicks / 10_000_000)) * 100);
    bar.style.width = pct + '%';
  }
}

// ── Now Playing UI ────────────────────────────────────────────────────────────
async function renderNowPlaying() {
  if (!selectedId) return;
  const [npRes, stRes] = await Promise.all([
    fetch(`${API}/stations/${selectedId}/now-playing`),
    fetch(`${API}/stations/${selectedId}`),
  ]);
  const np      = await npRes.json();
  const station = await stRes.json();
  const panel   = document.getElementById('nowPlayingPanel');

  const t = np.current;
  const trackCardHtml = t ? `
    <div class="track-title">${esc(t.name)}</div>
    <div class="track-artist">${esc(t.artist)}</div>
    ${t.album ? `<div class="track-album">${esc(t.album)}</div>` : ''}
    <div class="elapsed-row">
      <span id="elapsedTime">0:00</span>
      <div class="elapsed-bar-wrap"><div class="elapsed-bar" id="elapsedBar" style="width:0%"></div></div>
      <span id="durationTime">${t.duration_ticks ? fmt(t.duration_ticks / 10_000_000) : '--:--'}</span>
    </div>
    ${np.next ? `<div class="track-next">Up next: <strong>${esc(np.next.name)}</strong> by ${esc(np.next.artist)}</div>` : ''}
  ` : '<p class="empty">Hit Play to start the broadcast.</p>';

  panel.innerHTML = `
    <div style="margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <strong>${esc(station.name)}</strong>
      <span class="station-meta">${esc(station.genre)}</span>
      ${isPlaying ? '<span class="live-chip"><span class="live-dot"></span>LIVE</span>' : ''}
      <button class="btn btn-danger" style="margin-left:auto;padding:4px 10px;font-size:0.75rem" onclick="deleteStation('${selectedId}')">Delete</button>
    </div>

    <div class="now-playing-card" id="trackCard">
      ${trackCardHtml}
    </div>

    <div class="volume-row">
      🔊 <input type="range" min="0" max="1" step="0.05" value="${audio.volume}"
           oninput="audio.volume=this.value" title="Volume">
    </div>

    <div class="transport">
      <button class="btn btn-primary" onclick="togglePlay()">${isPlaying ? '⏹ Stop' : '▶ Play'}</button>
      <button class="btn btn-ghost" onclick="skip()" ${!isPlaying ? 'disabled' : ''}>⏭ Skip</button>
      <button class="btn btn-ghost" onclick="refill()" title="Re-fetch tracks from Jellyfin">⟳ Refill</button>
    </div>
  `;

  if (isPlaying && np.elapsed_seconds != null) {
    updateElapsed(np.elapsed_seconds, np.current?.duration_ticks);
  }
}

// ── Server voice picker ───────────────────────────────────────────────────────
async function loadServerVoices() {
  try {
    const r    = await fetch(`${API}/tts/voices`);
    const data = await r.json();
    const sel  = document.getElementById('voiceSelect');
    const saved = localStorage.getItem('jellyfm-server-voice') || '';

    const piper  = data.voices.filter(v => v.engine === 'piper');
    const espeak = data.voices.filter(v => v.engine === 'espeak');

    let html = '';
    if (piper.length) {
      html += `<optgroup label="Neural TTS (Kokoro)">`;
      html += piper.map(v => `<option value="${esc(v.id)}" ${v.id === saved ? 'selected' : ''}>${esc(v.label)}</option>`).join('');
      html += `</optgroup>`;
    }
    if (espeak.length) {
      html += `<optgroup label="espeak (Fallback)">`;
      html += espeak.map(v => `<option value="${esc(v.id)}" ${v.id === saved ? 'selected' : ''}>${esc(v.label)}</option>`).join('');
      html += `</optgroup>`;
    }
    if (!html) html = `<option value="">No server TTS — install espeak-ng or Piper</option>`;
    sel.innerHTML = html;

    if (!saved && sel.options.length) {
      sel.selectedIndex = 0;
      await setServerVoice();
    }
  } catch {}
}

async function setServerVoice() {
  const id = document.getElementById('voiceSelect').value;
  if (!id) return;
  localStorage.setItem('jellyfm-server-voice', id);
  await fetch(`${API}/tts/voice`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ voice_id: id }),
  });
}

async function previewVoice() {
  await setServerVoice();
  if (!selectedId) { toast('Select a station first to preview', true); return; }
  try {
    const r = await fetch(`${API}/stations/${selectedId}/announce`);
    if (r.ok && r.status !== 204) {
      const blob = await r.blob();
      const url  = URL.createObjectURL(blob);
      const a    = new Audio(url);
      a.onended = () => URL.revokeObjectURL(url);
      a.play();
    } else {
      toast('No TTS engine available on server', true);
    }
  } catch (e) { toast(e.message, true); }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmt(s) {
  const m   = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function toast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3500);
}

init();
</script>
</body>
</html>
