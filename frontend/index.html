<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JellyFM</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0f0f13;
    --surface: #1a1a22;
    --surface2:#22222e;
    --border:  #2e2e3e;
    --accent:  #7c6af7;
    --accent2: #a78bfa;
    --text:    #e2e2f0;
    --muted:   #7070a0;
    --danger:  #f87171;
    --success: #4ade80;
    --radius:  10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent2); }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); margin-left: auto;
    transition: background 0.3s;
  }
  .status-dot.ok  { background: var(--success); }
  .status-dot.err { background: var(--danger); }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 16px;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 20px;
  }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .panel-header {
    padding: 12px 16px;
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .panel-body { padding: 16px; }

  label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 8px 10px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 0.875rem;
    outline: none; transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .field { margin-bottom: 12px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px 14px; border-radius: 6px; font-size: 0.875rem; font-weight: 500;
    cursor: pointer; border: none; transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent2); }
  .btn-ghost {
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent2); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover:not(:disabled) { background: var(--danger); color: #fff; }

  .station-item {
    display: flex; flex-direction: column; gap: 6px;
    padding: 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; transition: all 0.15s;
    margin-bottom: 8px;
  }
  .station-item:hover  { background: var(--surface2); border-color: var(--border); }
  .station-item.active { background: var(--surface2); border-color: var(--accent); }
  .station-name { font-weight: 600; }
  .station-meta { font-size: 0.78rem; color: var(--muted); }

  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 99px;
    font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .badge-live { background: #1a3a2a; color: var(--success); }
  .badge-idle { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

  .now-playing-card {
    background: var(--surface2); border-radius: 8px; padding: 20px;
    border: 1px solid var(--border); margin-bottom: 16px;
    min-height: 100px; display: flex; flex-direction: column; justify-content: center;
  }
  .track-title  { font-size: 1.1rem; font-weight: 700; margin-bottom: 2px; }
  .track-artist { color: var(--muted); margin-bottom: 2px; }
  .track-album  { font-size: 0.78rem; color: var(--muted); }
  .track-next {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
    font-size: 0.8rem; color: var(--muted);
  }
  .track-next strong { color: var(--text); }

  .elapsed-row {
    margin-top: 10px;
    display: flex; align-items: center; gap: 10px;
    font-size: 0.78rem; color: var(--muted);
  }
  .elapsed-bar-wrap {
    flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .elapsed-bar {
    height: 100%; background: var(--accent); border-radius: 2px;
    /* No CSS transition — rAF updates this every frame for smooth motion */
  }

  .volume-row {
    display: flex; align-items: center; gap: 10px; margin-top: 12px;
    font-size: 0.8rem; color: var(--muted);
  }
  input[type=range] {
    width: 100px; accent-color: var(--accent); cursor: pointer;
    padding: 0; background: none; border: none;
  }

  .transport { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }

  .live-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 9px; border-radius: 99px; font-size: 0.7rem; font-weight: 700;
    background: #1a3a2a; color: var(--success); text-transform: uppercase; letter-spacing: 0.08em;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--success);
    animation: livepulse 1.5s ease-in-out infinite;
  }

  .empty { color: var(--muted); font-size: 0.875rem; }

  #toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px;
    font-size: 0.85rem; max-width: 320px;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; z-index: 9999;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.err  { border-color: var(--danger); color: var(--danger); }

  @keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:.4} }
</style>
</head>
<body>

<header>
  <h1>Jelly<span>FM</span></h1>
  <div id="statusDot" class="status-dot" title="Server status"></div>
</header>

<!--
  Single hidden audio element. Its src is set once to /stations/sessions/{id}
  when the user first presses Play and NEVER changes again.  Switching stations
  sends a PUT request that re-routes the server-side session to the new
  broadcast — the audio element stays connected to the same persistent URL.
-->
<audio id="player" preload="none"></audio>

<main>
  <div>
    <!-- Create station -->
    <div class="panel" style="margin-bottom:16px">
      <div class="panel-header">New Station</div>
      <div class="panel-body">
        <div class="field">
          <label>Station name</label>
          <input id="newName" placeholder="e.g. Late Night Jazz" />
        </div>
        <div class="field">
          <label>Genre</label>
          <select id="newGenre"><option value="">— loading —</option></select>
        </div>
        <div class="field" style="display:flex;align-items:center;gap:8px;margin-bottom:0">
          <input type="checkbox" id="newShuffle" checked style="width:auto">
          <label for="newShuffle" style="margin:0;cursor:pointer">Shuffle</label>
        </div>
        <div style="margin-top:14px">
          <button class="btn btn-primary" id="createBtn" onclick="createStation()">Create Station</button>
        </div>
      </div>
    </div>

    <!-- Voice picker -->
    <div class="panel" style="margin-bottom:16px">
      <div class="panel-header">Announcer Voice</div>
      <div class="panel-body">
        <div class="field" style="margin-bottom:8px">
          <label>Server voice</label>
          <select id="voiceSelect" onchange="setServerVoice()">
            <option value="">— loading —</option>
          </select>
        </div>
        <button class="btn btn-ghost" style="font-size:0.8rem;padding:5px 10px"
                onclick="previewVoice()">Preview voice</button>
      </div>
    </div>

    <!-- Station list -->
    <div class="panel">
      <div class="panel-header">Stations</div>
      <div class="panel-body" id="stationList">
        <p class="empty">No stations yet.</p>
      </div>
    </div>
  </div>

  <!-- Now Playing panel -->
  <div>
    <div class="panel">
      <div class="panel-header">Now Playing</div>
      <div class="panel-body" id="nowPlayingPanel">
        <p class="empty">Select a station and press Play.</p>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
//  JellyFM frontend — persistent session streaming receiver
//
//  Design contract:
//    • The server runs a headless broadcast loop 24/7 per station.
//    • On first Play, POST /stations/sessions creates a proxy session.
//      audio.src is set to /stations/sessions/{id} exactly once and never
//      changes again — even when the user switches stations.
//    • Switching stations: PUT /stations/sessions/{id}/station re-routes the
//      server-side session to the new broadcast mid-stream.  The audio element
//      stays connected to the same URL — zero reconnection gap.
//    • Progress bar and metadata driven by polling /{id}/now-playing every 2 s.
//      Between polls, requestAnimationFrame interpolates elapsed position at
//      60 fps using performance.now() delta.
//    • Skip sends POST /{id}/skip — the server flushes the current decoder.
//      All connected sessions hear the change simultaneously.
// ═══════════════════════════════════════════════════════════════════════════════

const API   = '';
const audio = document.getElementById('player');

// ── UI / playback state ───────────────────────────────────────────────────────
let selectedId = null;   // currently selected station ID
let isPlaying  = false;  // whether this tab has an active stream session

// ── Proxy session state ───────────────────────────────────────────────────────
// sessionId is created once on first Play and reused for all channel switches.
// It is cleared when the user explicitly presses Stop.
let sessionId = null;

// ── Poll state (drives progress bar interpolation) ────────────────────────────
let pollInterval      = null;
let lastTrackId       = null;
let lastPollElapsed   = null;
let lastPollTimestamp = null;
let lastDurationSec   = null;

// ── Stream error handling ─────────────────────────────────────────────────────
let streamRetries = 0;
const MAX_STREAM_RETRIES = 3;

// ─────────────────────────────────────────────────────────────────────────────
//  BOOT
// ─────────────────────────────────────────────────────────────────────────────

async function init() {
  audio.addEventListener('error', onStreamError);
  requestAnimationFrame(progressFrame);
  await Promise.all([checkHealth(), loadGenres(), loadServerVoices()]);
  await loadStations();
}

// ─────────────────────────────────────────────────────────────────────────────
//  STREAM ERROR HANDLING
// ─────────────────────────────────────────────────────────────────────────────

function onStreamError() {
  if (!isPlaying || !sessionId) return;
  streamRetries++;
  if (streamRetries <= MAX_STREAM_RETRIES) {
    const delay = streamRetries * 2000;
    toast(`Stream interrupted — reconnecting in ${delay / 1000}s… (${streamRetries}/${MAX_STREAM_RETRIES})`, true);
    setTimeout(() => {
      if (isPlaying && sessionId) reattachSession();
    }, delay);
  } else {
    toast('Stream unavailable after retries. Press Play to try again.', true);
    isPlaying  = false;
    sessionId  = null;
    streamRetries = 0;
    stopPolling();
    redrawTransport();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  HEALTH + GENRE LOADING
// ─────────────────────────────────────────────────────────────────────────────

async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    document.getElementById('statusDot').className =
      r.ok ? 'status-dot ok' : 'status-dot err';
  } catch {
    document.getElementById('statusDot').className = 'status-dot err';
  }
}

async function loadGenres() {
  try {
    const r      = await fetch(`${API}/genres`);
    const genres = await r.json();
    const sel    = document.getElementById('newGenre');
    sel.innerHTML = genres.length
      ? genres.map(g =>
          `<option value="${esc(g.name)}">${esc(g.name)}${g.track_count ? ` (${g.track_count})` : ''}</option>`
        ).join('')
      : '<option value="">No genres found</option>';
  } catch {
    toast('Could not reach server', true);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  STATION LIST
// ─────────────────────────────────────────────────────────────────────────────

async function loadStations() {
  try {
    const r        = await fetch(`${API}/stations`);
    const stations = await r.json();
    renderStationList(stations);
  } catch {}
}

function renderStationList(stations) {
  const el = document.getElementById('stationList');
  if (!stations.length) {
    el.innerHTML = '<p class="empty">No stations yet.</p>';
    return;
  }
  el.innerHTML = stations.map(s => {
    const live = s.id === selectedId && isPlaying;
    return `
      <div class="station-item ${s.id === selectedId ? 'active' : ''}"
           onclick="selectStation('${s.id}')">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="station-name">${esc(s.name)}</span>
          <span class="badge ${live ? 'badge-live' : 'badge-idle'}">${live ? '● LIVE' : 'idle'}</span>
        </div>
        <span class="station-meta">${esc(s.genre)} · ${s.queue.length} tracks</span>
      </div>`;
  }).join('');
}

async function createStation() {
  const name    = document.getElementById('newName').value.trim();
  const genre   = document.getElementById('newGenre').value;
  const shuffle = document.getElementById('newShuffle').checked;
  if (!name || !genre) { toast('Name and genre required', true); return; }
  const btn = document.getElementById('createBtn');
  btn.disabled = true;
  try {
    const r = await fetch(`${API}/stations`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ name, genre, shuffle }),
    });
    if (!r.ok) throw new Error((await r.json()).detail);
    const station = await r.json();
    document.getElementById('newName').value = '';
    toast(`Station "${station.name}" created`);
    await loadStations();
    selectStation(station.id);
  } catch (e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false;
  }
}

async function selectStation(id) {
  if (id === selectedId) return;

  if (isPlaying && sessionId) {
    // Session is live — switch channels server-side without touching audio.src.
    // The server drains stale audio and seeds from the new broadcast instantly.
    selectedId = id;
    lastTrackId = null;
    try {
      const r = await fetch(`${API}/stations/sessions/${sessionId}/station`, {
        method:  'PUT',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ station_id: id }),
      });
      if (!r.ok) {
        // Session expired — fall back to a full reconnect
        sessionId = null;
        isPlaying = false;
        await play();
        return;
      }
      toast('Switched station');
    } catch {
      toast('Switch failed', true);
    }
  } else {
    selectedId = id;
    lastTrackId = null;
  }

  await loadStations();
  await renderNowPlayingPanel();
}

async function deleteStation(id) {
  if (!confirm('Delete this station?')) return;
  if (selectedId === id) {
    detachStream();
    selectedId = null;
    document.getElementById('nowPlayingPanel').innerHTML =
      '<p class="empty">Select a station and press Play.</p>';
  }
  await fetch(`${API}/stations/${id}`, { method: 'DELETE' });
  await loadStations();
}

// ─────────────────────────────────────────────────────────────────────────────
//  SESSION MANAGEMENT
//  createProxySession: POST /stations/sessions → session_id
//  attachSession:      set audio.src to the session stream URL (called once)
//  reattachSession:    re-point audio.src to the same session URL on error
//  detachStream:       pause and clear the audio element, close session
// ─────────────────────────────────────────────────────────────────────────────

async function createProxySession(stationId) {
  const r = await fetch(`${API}/stations/sessions`, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ station_id: stationId }),
  });
  if (!r.ok) throw new Error('Could not create stream session');
  const data = await r.json();
  return data.session_id;
}

function attachSession(sid) {
  streamRetries = 0;
  // Cache-buster prevents browser from replaying a stale cached response.
  audio.src = `${API}/stations/sessions/${sid}?_=${Date.now()}`;
  audio.load();
  audio.play().catch(() => toast('Tap the page first, then press Play.', true));
}

function reattachSession() {
  if (!sessionId) return;
  audio.pause();
  attachSession(sessionId);
}

function detachStream() {
  audio.pause();
  audio.src = '';
  isPlaying  = false;
  sessionId  = null;
  streamRetries = 0;
  stopPolling();
  lastPollElapsed   = null;
  lastPollTimestamp = null;
  lastDurationSec   = null;
}

// ─────────────────────────────────────────────────────────────────────────────
//  PLAY / STOP / SKIP / REFILL
// ─────────────────────────────────────────────────────────────────────────────

async function play() {
  if (!selectedId) return;
  try {
    // Create session only if we don't already have one
    if (!sessionId) {
      sessionId = await createProxySession(selectedId);
    }
    attachSession(sessionId);
    isPlaying = true;
    startPolling();
    await loadStations();
    redrawTransport();
  } catch (e) {
    toast(e.message || 'Could not start stream', true);
  }
}

function stop() {
  detachStream();
  loadStations();
  redrawTransport();
}

function togglePlay() {
  if (isPlaying) stop(); else play();
}

async function skip() {
  if (!selectedId || !isPlaying) return;
  await fetch(`${API}/stations/${selectedId}/skip`, { method: 'POST' });
  toast('Skipping…');
}

async function refill() {
  if (!selectedId) return;
  await fetch(`${API}/stations/${selectedId}/refill`, { method: 'POST' });
  toast('Queue refilled');
}

// ─────────────────────────────────────────────────────────────────────────────
//  NOW-PLAYING POLL
// ─────────────────────────────────────────────────────────────────────────────

function startPolling() {
  stopPolling();
  pollInterval = setInterval(pollNowPlaying, 2000);
  pollNowPlaying();
}

function stopPolling() {
  clearInterval(pollInterval);
  pollInterval = null;
}

async function pollNowPlaying() {
  if (!selectedId) return;
  let np;
  try {
    const r = await fetch(`${API}/stations/${selectedId}/now-playing`);
    np = await r.json();
  } catch {
    return;
  }

  if (np.elapsed_seconds != null) {
    lastPollElapsed   = np.elapsed_seconds;
    lastPollTimestamp = performance.now();
  }
  lastDurationSec = np.current?.duration_ticks
    ? np.current.duration_ticks / 10_000_000
    : null;

  const incomingId = np.current?.id ?? null;
  if (incomingId !== lastTrackId) {
    lastTrackId = incomingId;
    renderTrackCard(np);
  }

  const nextEl = document.getElementById('upNextEl');
  if (nextEl) {
    nextEl.innerHTML = np.next
      ? `Up next: <strong>${esc(np.next.name)}</strong> by ${esc(np.next.artist)}`
      : '';
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  60 FPS PROGRESS BAR INTERPOLATION
// ─────────────────────────────────────────────────────────────────────────────

function progressFrame() {
  if (isPlaying && lastPollElapsed !== null && lastPollTimestamp !== null) {
    const secondsSincePoll = (performance.now() - lastPollTimestamp) / 1000;
    const interpolated     = lastPollElapsed + secondsSincePoll;

    const timeEl = document.getElementById('elapsedTime');
    const barEl  = document.getElementById('elapsedBar');

    if (timeEl) timeEl.textContent = fmt(interpolated);
    if (barEl && lastDurationSec && lastDurationSec > 0) {
      const pct = Math.min(100, (interpolated / lastDurationSec) * 100);
      barEl.style.width = pct.toFixed(2) + '%';
    }
  }
  requestAnimationFrame(progressFrame);
}

// ─────────────────────────────────────────────────────────────────────────────
//  NOW-PLAYING PANEL RENDERING
// ─────────────────────────────────────────────────────────────────────────────

async function renderNowPlayingPanel() {
  if (!selectedId) return;
  let station, np;
  try {
    const [stRes, npRes] = await Promise.all([
      fetch(`${API}/stations/${selectedId}`),
      fetch(`${API}/stations/${selectedId}/now-playing`),
    ]);
    station = await stRes.json();
    np      = await npRes.json();
  } catch {
    return;
  }

  if (np.elapsed_seconds != null) {
    lastPollElapsed   = np.elapsed_seconds;
    lastPollTimestamp = performance.now();
  }
  lastDurationSec = np.current?.duration_ticks
    ? np.current.duration_ticks / 10_000_000
    : null;

  const panel = document.getElementById('nowPlayingPanel');
  panel.innerHTML = `
    <div style="margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <strong>${esc(station.name)}</strong>
      <span class="station-meta">${esc(station.genre)}</span>
      ${isPlaying ? '<span class="live-chip"><span class="live-dot"></span>LIVE</span>' : ''}
      <button class="btn btn-danger"
              style="margin-left:auto;padding:4px 10px;font-size:0.75rem"
              onclick="deleteStation('${selectedId}')">Delete</button>
    </div>

    <div class="now-playing-card" id="trackCard">
      <p class="empty">${isPlaying ? 'Waiting for broadcast…' : 'Press Play to connect.'}</p>
    </div>

    <div class="volume-row">
      🔊 <input type="range" min="0" max="1" step="0.05" value="${audio.volume}"
           oninput="audio.volume=this.value" title="Volume">
    </div>

    <div class="transport" id="transport">
      <button class="btn btn-primary" id="playBtn" onclick="togglePlay()">
        ${isPlaying ? '⏹ Stop' : '▶ Play'}
      </button>
      <button class="btn btn-ghost" id="skipBtn"
              onclick="skip()" ${!isPlaying ? 'disabled' : ''}>⏭ Skip</button>
      <button class="btn btn-ghost" onclick="refill()"
              title="Re-fetch tracks from Jellyfin">⟳ Refill</button>
    </div>
  `;

  if (np.current) {
    lastTrackId = np.current.id;
    renderTrackCard(np);
  }
}

function renderTrackCard(np) {
  const card = document.getElementById('trackCard');
  if (!card) return;

  const t = np.current;
  if (!t) {
    card.innerHTML = '<p class="empty">Waiting for broadcast…</p>';
    return;
  }

  card.innerHTML = `
    <div class="track-title">${esc(t.name)}</div>
    <div class="track-artist">${esc(t.artist)}</div>
    ${t.album ? `<div class="track-album">${esc(t.album)}</div>` : ''}
    <div class="elapsed-row">
      <span id="elapsedTime">0:00</span>
      <div class="elapsed-bar-wrap">
        <div class="elapsed-bar" id="elapsedBar" style="width:0%"></div>
      </div>
      <span id="durationTime">${t.duration_ticks ? fmt(t.duration_ticks / 10_000_000) : '--:--'}</span>
    </div>
    <div id="upNextEl" class="track-next">
      ${np.next ? `Up next: <strong>${esc(np.next.name)}</strong> by ${esc(np.next.artist)}` : ''}
    </div>
  `;
}

function redrawTransport() {
  const playBtn  = document.getElementById('playBtn');
  const skipBtn  = document.getElementById('skipBtn');
  const liveChip = document.querySelector('.live-chip');

  if (playBtn) playBtn.textContent = isPlaying ? '⏹ Stop' : '▶ Play';
  if (skipBtn) skipBtn.disabled = !isPlaying;
  if (liveChip) liveChip.style.display = isPlaying ? '' : 'none';
}

// ─────────────────────────────────────────────────────────────────────────────
//  SERVER VOICE PICKER
// ─────────────────────────────────────────────────────────────────────────────

async function loadServerVoices() {
  try {
    const r    = await fetch(`${API}/tts/voices`);
    const data = await r.json();
    const sel  = document.getElementById('voiceSelect');
    const saved = localStorage.getItem('jellyfm-server-voice') || '';

    const neural = data.voices.filter(v => v.engine === 'piper');
    const legacy = data.voices.filter(v => v.engine === 'espeak');

    let html = '';
    if (neural.length) {
      html += `<optgroup label="Neural TTS (Kokoro)">`;
      html += neural.map(v =>
        `<option value="${esc(v.id)}" ${v.id === saved ? 'selected' : ''}>${esc(v.label)}</option>`
      ).join('');
      html += `</optgroup>`;
    }
    if (legacy.length) {
      html += `<optgroup label="espeak (Fallback)">`;
      html += legacy.map(v =>
        `<option value="${esc(v.id)}" ${v.id === saved ? 'selected' : ''}>${esc(v.label)}</option>`
      ).join('');
      html += `</optgroup>`;
    }
    if (!html) {
      html = `<option value="">No TTS engine — install espeak-ng or Kokoro</option>`;
    }
    sel.innerHTML = html;

    if (!saved && sel.options.length) {
      sel.selectedIndex = 0;
      await setServerVoice();
    }
  } catch {}
}

async function setServerVoice() {
  const id = document.getElementById('voiceSelect').value;
  if (!id) return;
  localStorage.setItem('jellyfm-server-voice', id);
  await fetch(`${API}/tts/voice`, {
    method:  'PUT',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ voice_id: id }),
  });
}

async function previewVoice() {
  await setServerVoice();
  if (!selectedId) { toast('Select a station first to preview', true); return; }
  try {
    const r = await fetch(`${API}/stations/${selectedId}/announce`);
    if (r.ok && r.status !== 204) {
      const blob = await r.blob();
      const url  = URL.createObjectURL(blob);
      const a    = new Audio(url);
      a.onended = () => URL.revokeObjectURL(url);
      a.play();
    } else {
      toast('No TTS engine available on server', true);
    }
  } catch (e) {
    toast(e.message, true);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  UTILITIES
// ─────────────────────────────────────────────────────────────────────────────

function fmt(totalSeconds) {
  const s = Math.max(0, Math.floor(totalSeconds));
  const m = Math.floor(s / 60);
  const r = (s % 60).toString().padStart(2, '0');
  return `${m}:${r}`;
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

let _toastTimer;
function toast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'show' + (err ? ' err' : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = ''; }, 3500);
}

// ─────────────────────────────────────────────────────────────────────────────
init();
</script>
