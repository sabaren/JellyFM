<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JellyFM</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: #2e2e3e;
    --accent: #7c6af7;
    --accent2: #a78bfa;
    --text: #e2e2f0;
    --muted: #7070a0;
    --danger: #f87171;
    --success: #4ade80;
    --radius: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent2); }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); margin-left: auto;
    transition: background 0.3s;
  }
  .status-dot.ok { background: var(--success); }
  .status-dot.err { background: var(--danger); }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 16px;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 20px;
  }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .panel-header {
    padding: 12px 16px;
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .panel-body { padding: 16px; }

  label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 8px 10px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 0.875rem;
    outline: none; transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .field { margin-bottom: 12px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px 14px; border-radius: 6px; font-size: 0.875rem; font-weight: 500;
    cursor: pointer; border: none; transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent2); }
  .btn-ghost {
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent2); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover:not(:disabled) { background: var(--danger); color: #fff; }

  .station-item {
    display: flex; flex-direction: column; gap: 6px;
    padding: 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; transition: all 0.15s;
    margin-bottom: 8px;
  }
  .station-item:hover { background: var(--surface2); border-color: var(--border); }
  .station-item.active { background: var(--surface2); border-color: var(--accent); }
  .station-name { font-weight: 600; }
  .station-meta { font-size: 0.78rem; color: var(--muted); }

  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 99px;
    font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .badge-playing { background: #1a3a2a; color: var(--success); }
  .badge-idle    { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .badge-paused  { background: #2a2a1a; color: #facc15; }

  /* Now playing */
  .now-playing-card {
    background: var(--surface2); border-radius: 8px; padding: 20px;
    border: 1px solid var(--border); margin-bottom: 16px;
    min-height: 100px; display: flex; flex-direction: column; justify-content: center;
  }
  .track-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 2px; }
  .track-artist { color: var(--muted); margin-bottom: 2px; }
  .track-album { font-size: 0.78rem; color: var(--muted); }
  .track-next {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
    font-size: 0.8rem; color: var(--muted);
  }
  .track-next strong { color: var(--text); }

  /* Progress bar */
  .progress-wrap {
    margin: 14px 0 4px;
    display: flex; align-items: center; gap: 10px;
  }
  progress {
    flex: 1; height: 4px; border-radius: 2px;
    appearance: none; background: var(--border);
  }
  progress::-webkit-progress-bar { background: var(--border); border-radius: 2px; }
  progress::-webkit-progress-value { background: var(--accent); border-radius: 2px; transition: width 0.5s linear; }
  progress::-moz-progress-bar { background: var(--accent); border-radius: 2px; }
  .time { font-size: 0.75rem; color: var(--muted); min-width: 36px; text-align: right; }

  /* Volume */
  .volume-row {
    display: flex; align-items: center; gap: 10px; margin-top: 12px;
    font-size: 0.8rem; color: var(--muted);
  }
  input[type=range] {
    width: 100px; accent-color: var(--accent); cursor: pointer;
    padding: 0; background: none; border: none;
  }

  .transport { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }

  .empty { color: var(--muted); font-size: 0.875rem; }

  #toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px;
    font-size: 0.85rem; max-width: 320px;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; z-index: 9999;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.err { border-color: var(--danger); color: var(--danger); }

  /* Spinning animation for playing state */
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .badge-playing { animation: pulse 2s ease-in-out infinite; }
</style>
</head>
<body>

<header>
  <h1>Jelly<span>FM</span></h1>
  <div id="statusDot" class="status-dot" title="Server status"></div>
</header>

<!-- Hidden audio element — the actual player -->
<audio id="player" preload="auto"></audio>

<main>
  <!-- Left: create + list -->
  <div>
    <div class="panel" style="margin-bottom:16px">
      <div class="panel-header">New Station</div>
      <div class="panel-body">
        <div class="field">
          <label>Station name</label>
          <input id="newName" placeholder="e.g. Late Night Jazz" />
        </div>
        <div class="field">
          <label>Genre</label>
          <select id="newGenre"><option value="">— loading —</option></select>
        </div>
        <div class="field" style="display:flex;align-items:center;gap:8px;margin-bottom:0">
          <input type="checkbox" id="newShuffle" checked style="width:auto">
          <label for="newShuffle" style="margin:0;cursor:pointer">Shuffle</label>
        </div>
        <div style="margin-top:14px">
          <button class="btn btn-primary" id="createBtn" onclick="createStation()">Create Station</button>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:16px">
      <div class="panel-header">Announcer Voice</div>
      <div class="panel-body">
        <div class="field" style="margin-bottom:8px">
          <label>Voice</label>
          <select id="voiceSelect" onchange="saveVoice()">
            <option value="">— loading voices —</option>
          </select>
        </div>
        <button class="btn btn-ghost" style="font-size:0.8rem;padding:5px 10px" onclick="previewVoice()">Preview voice</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">Stations</div>
      <div class="panel-body" id="stationList">
        <p class="empty">No stations yet.</p>
      </div>
    </div>
  </div>

  <!-- Right: now playing -->
  <div>
    <div class="panel">
      <div class="panel-header">Now Playing</div>
      <div class="panel-body" id="nowPlayingPanel">
        <p class="empty">Create a station and hit Play.</p>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
const API = '';
const audio = document.getElementById('player');

let selectedId = null;
let genres = [];
let isPlaying = false;
let progressTimer = null;

// ── Bootstrap ────────────────────────────────────────────────────────────────
async function init() {
  await Promise.all([checkHealth(), loadGenres()]);
  await loadStations();

  // When a track finishes naturally, skip to next
  audio.addEventListener('ended', () => advanceTrack());
  audio.addEventListener('error', (e) => {
    console.error('Audio error', e);
    toast('Playback error — skipping', true);
    advanceTrack();
  });

  // Keep progress bar ticking
  audio.addEventListener('timeupdate', updateProgress);
}

async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    document.getElementById('statusDot').className = r.ok ? 'status-dot ok' : 'status-dot err';
  } catch {
    document.getElementById('statusDot').className = 'status-dot err';
  }
}

async function loadGenres() {
  try {
    const r = await fetch(`${API}/genres`);
    genres = await r.json();
    const sel = document.getElementById('newGenre');
    sel.innerHTML = genres.length
      ? genres.map(g => `<option value="${esc(g.name)}">${esc(g.name)}${g.track_count ? ` (${g.track_count})` : ''}</option>`).join('')
      : '<option value="">No genres found</option>';
  } catch { toast('Could not reach server', true); }
}

// ── Stations ─────────────────────────────────────────────────────────────────
async function loadStations() {
  try {
    const r = await fetch(`${API}/stations`);
    const stations = await r.json();
    renderStationList(stations);
  } catch {}
}

function renderStationList(stations) {
  const el = document.getElementById('stationList');
  if (!stations.length) { el.innerHTML = '<p class="empty">No stations yet.</p>'; return; }
  el.innerHTML = stations.map(s => {
    const status = (selectedId === s.id) ? (isPlaying ? 'playing' : 'paused') : 'idle';
    return `
      <div class="station-item ${s.id === selectedId ? 'active' : ''}" onclick="selectStation('${s.id}')">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="station-name">${esc(s.name)}</span>
          <span class="badge badge-${status}">${status}</span>
        </div>
        <span class="station-meta">${esc(s.genre)} · ${s.queue.length} tracks</span>
      </div>`;
  }).join('');
}

async function createStation() {
  const name = document.getElementById('newName').value.trim();
  const genre = document.getElementById('newGenre').value;
  const shuffle = document.getElementById('newShuffle').checked;
  if (!name || !genre) { toast('Name and genre required', true); return; }
  const btn = document.getElementById('createBtn');
  btn.disabled = true;
  try {
    const r = await fetch(`${API}/stations`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, genre, shuffle }),
    });
    if (!r.ok) throw new Error((await r.json()).detail);
    const station = await r.json();
    document.getElementById('newName').value = '';
    toast(`Station "${station.name}" created`);
    await loadStations();
    await selectStation(station.id);
  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; }
}

async function selectStation(id) {
  // Stop current playback if switching stations
  if (selectedId && selectedId !== id) {
    audio.pause();
    audio.src = '';
    isPlaying = false;
  }
  selectedId = id;
  await loadStations();
  await renderNowPlaying();
}

async function deleteStation(id) {
  if (!confirm('Delete this station?')) return;
  if (selectedId === id) {
    audio.pause();
    audio.src = '';
    isPlaying = false;
    selectedId = null;
    document.getElementById('nowPlayingPanel').innerHTML = '<p class="empty">Create a station and hit Play.</p>';
  }
  await fetch(`${API}/stations/${id}`, { method: 'DELETE' });
  await loadStations();
}

// ── Playback ─────────────────────────────────────────────────────────────────
async function play() {
  if (!selectedId) return;
  const np = await fetchNowPlaying();
  if (!np?.current) { toast('Queue is empty — try Refill', true); return; }

  announce(np.current, np.next);

  // Small gap after TTS before audio starts
  await sleep(announcementDuration(np.current, np.next) + 400);

  audio.src = `${API}/stations/${selectedId}/stream`;
  audio.load();
  try {
    await audio.play();
    isPlaying = true;
    await loadStations();
    await renderNowPlaying();
  } catch (e) {
    toast('Browser blocked autoplay — click Play again', true);
  }
}

function pause() {
  if (audio.paused) {
    audio.play();
    isPlaying = true;
  } else {
    audio.pause();
    isPlaying = false;
  }
  loadStations();
  renderNowPlaying();
}

async function advanceTrack() {
  if (!selectedId) return;
  await fetch(`${API}/stations/${selectedId}/skip`, { method: 'POST' });
  await play();
}

async function skipTrack() {
  audio.pause();
  audio.src = '';
  isPlaying = false;
  await advanceTrack();
}

async function previousTrack() {
  audio.pause();
  audio.src = '';
  isPlaying = false;
  await fetch(`${API}/stations/${selectedId}/previous`, { method: 'POST' });
  await play();
}

async function refill() {
  audio.pause();
  audio.src = '';
  isPlaying = false;
  await fetch(`${API}/stations/${selectedId}/refill`, { method: 'POST' });
  toast('Queue refilled');
  await renderNowPlaying();
}

// ── Voice picker ─────────────────────────────────────────────────────────────
let voices = [];

function loadVoices() {
  voices = window.speechSynthesis?.getVoices() ?? [];
  if (!voices.length) return;
  const sel = document.getElementById('voiceSelect');
  const saved = localStorage.getItem('jellyfm-voice');
  sel.innerHTML = voices.map((v, i) =>
    `<option value="${i}" ${saved == i ? 'selected' : ''}>${v.name} (${v.lang})</option>`
  ).join('');
}

function saveVoice() {
  const idx = document.getElementById('voiceSelect').value;
  localStorage.setItem('jellyfm-voice', idx);
}

function getSelectedVoice() {
  const idx = parseInt(localStorage.getItem('jellyfm-voice') ?? '0', 10);
  return voices[idx] ?? null;
}

function previewVoice() {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance("Hey there. I'm your JellyFM announcer.");
  utt.voice = getSelectedVoice();
  utt.rate = 1.05;
  window.speechSynthesis.speak(utt);
}

// Voices load asynchronously in most browsers
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices(); // also try immediately (Firefox)
}

// ── TTS via Web Speech API ────────────────────────────────────────────────────
const BANTER = {
  rock:       ["Buckle up — serious riff energy.", "Nothing fixes a bad day like a power chord.", "Turn it up. Your neighbours have headphones."],
  jazz:       ["Close your eyes. You're in a smoky club. It's 1957.", "Jazz: musicians having more fun than you.", "This one swings hard."],
  classical:  ["No words needed. Just listen.", "Centuries old and still hits different.", "Clear your mind. Full attention."],
  pop:        ["You'll be humming this all week.", "Infectious hooks incoming.", "Straight to the chorus. No patience required."],
  'hip-hop':  ["Bars. Straight bars.", "This beat alone is worth it.", "Lyricism and rhythm in perfect balance."],
  electronic: ["Four on the floor. Let's go.", "Your brain on synthesisers.", "Built in a laptop and it still slaps."],
  metal:      ["Volume up. Way up.", "This is foreground music.", "The guitars are angry. That's a feature."],
};
const GENERIC = ["Here's one that deserves your full attention.", "A track that holds up every time.", "Sit back. Let it play.", "Coming up — no skipping allowed."];

function getBanter(genre) {
  const pool = genre ? (BANTER[genre.toLowerCase()] || GENERIC) : GENERIC;
  return pool[Math.floor(Math.random() * pool.length)];
}

function announce(current, next) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const banter = getBanter(current.genre);
  let text = `${banter}  Coming up: ${current.name} by ${current.artist}.`;
  if (next) text += `  And after that: ${next.name} by ${next.artist}.`;
  const utt = new SpeechSynthesisUtterance(text);
  utt.voice = getSelectedVoice();
  utt.rate = 1.05;
  utt.volume = 0.9;
  window.speechSynthesis.speak(utt);
}

function announcementDuration(current, next) {
  // Rough estimate: ~130 words/min at rate 1.05 → ~2.3 chars/100ms
  const banter = getBanter(current.genre);
  let text = `${banter} Coming up: ${current.name} by ${current.artist}.`;
  if (next) text += ` And after that: ${next.name} by ${next.artist}.`;
  return (text.length / 2.3) * 100;  // ms
}

// ── Now Playing UI ────────────────────────────────────────────────────────────
async function fetchNowPlaying() {
  if (!selectedId) return null;
  try {
    const r = await fetch(`${API}/stations/${selectedId}/now-playing`);
    return await r.json();
  } catch { return null; }
}

async function renderNowPlaying() {
  if (!selectedId) return;
  const [np, stRes] = await Promise.all([
    fetchNowPlaying(),
    fetch(`${API}/stations/${selectedId}`),
  ]);
  const station = await stRes.json();
  const panel = document.getElementById('nowPlayingPanel');

  const playPauseLabel = isPlaying ? '⏸ Pause' : '▶ Play';
  const playPauseAction = isPlaying ? 'pause()' : 'play()';

  const trackHtml = np?.current ? `
    <div class="now-playing-card">
      <div class="track-title">${esc(np.current.name)}</div>
      <div class="track-artist">${esc(np.current.artist)}</div>
      ${np.current.album ? `<div class="track-album">${esc(np.current.album)}</div>` : ''}
      <div class="progress-wrap">
        <progress id="prog" value="0" max="100"></progress>
        <span class="time" id="timeEl">0:00</span>
      </div>
      ${np.next ? `<div class="track-next">Up next: <strong>${esc(np.next.name)}</strong> by ${esc(np.next.artist)}</div>` : ''}
    </div>
  ` : `<div class="now-playing-card"><p class="empty">Hit Play to start.</p></div>`;

  panel.innerHTML = `
    <div style="margin-bottom:12px;display:flex;align-items:center;gap:8px">
      <strong>${esc(station.name)}</strong>
      <span class="station-meta">${esc(station.genre)}</span>
      <button class="btn btn-danger" style="margin-left:auto;padding:4px 10px;font-size:0.75rem" onclick="deleteStation('${selectedId}')">Delete</button>
    </div>

    ${trackHtml}

    <div class="volume-row">
      🔊 <input type="range" min="0" max="1" step="0.05" value="${audio.volume}"
           oninput="audio.volume=this.value" title="Volume">
    </div>

    <div class="transport">
      <button class="btn btn-ghost" onclick="previousTrack()">⏮</button>
      <button class="btn btn-primary" onclick="${playPauseAction}">${playPauseLabel}</button>
      <button class="btn btn-ghost" onclick="skipTrack()">⏭ Skip</button>
      <button class="btn btn-ghost" onclick="refill()" title="Re-fetch tracks from Jellyfin">⟳ Refill</button>
    </div>
  `;
}

function updateProgress() {
  const prog = document.getElementById('prog');
  const timeEl = document.getElementById('timeEl');
  if (!prog || !audio.duration) return;
  prog.value = (audio.currentTime / audio.duration) * 100;
  timeEl.textContent = fmt(audio.currentTime);
}

function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function toast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3500);
}

init();
</script>
</body>
</html>
